[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sweverifier"
version = "0.1.0"
description = "A hand-written coding agent for SWE-bench Lite, and verifiers that pick the best of N patches"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["swebench>=5", "datasets", "openai>=1.40", "python-dotenv", "tree-sitter>=0.23", "tree-sitter-python",
                "numpy", "pandas", "scikit-learn"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "matplotlib>=3.8"]

[project.scripts]
sweverifier = "sweverifier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["runs", "data", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
